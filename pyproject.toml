[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["src/health.py"]
markers = [
    "unit: fast tests, no external dependencies",
    "integration: require Docker via testcontainers",
    "api: HTTP tests via FastAPI TestClient",
]
